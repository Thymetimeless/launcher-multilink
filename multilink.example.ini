[multilink]
; Adapter names as shown by Get-NetAdapter / "Network Connections". Each needs its own IPv4 default gateway.
; New connections go to them round-robin; list an adapter several times to give it a bigger share,
; e.g. a 90 Mbit/s LAN with two 20 Mbit/s links: Ethernet,Ethernet,Ethernet,Ethernet,Wi-Fi,Ethernet 5
adapters=Ethernet,Wi-Fi

; One section per launcher. enabled=true/false (or 1/0) picks which ones multilink_inject.exe handles when started
; without arguments (double-click); "multilink_inject.exe steam" runs one profile even if it is disabled.
; The DLL picks the section whose process= is the exe it was loaded into
; and patches module= (the launcher's download engine).
; hook=inline patches ws2_32!bind for the whole process instead (for .NET launchers that have no
; import table entry to patch); module= is then ignored.
; start= is the launcher exe to run when the process isn't running (full path).
; autostart=true only for launchers that run elevated anyway; others must be started normally first.

[hoyoplay]
; HoYoPlay: Genshin Impact, Honkai: Star Rail, Zenless Zone Zero, Honkai Impact 3rd
process=HYP.exe
enabled=false
module=sophon.dll
start=C:\Program Files\HoYoPlay\launcher.exe
autostart=true

[steam]
; Steam: games Steam itself downloads. Wuthering Waves on Steam updates through its own launcher: see [wuwa]
process=steam.exe
enabled=true
module=steamclient64.dll
start=C:\Program Files (x86)\Steam\steam.exe
autostart=false

[wuwa]
; Wuthering Waves (Kuro launcher, also used by the Steam release). The downloader is .NET HttpClient.
process=launcher_main.exe
enabled=true
hook=inline
start=C:\Program Files\Wuthering Waves\launcher.exe
autostart=true
